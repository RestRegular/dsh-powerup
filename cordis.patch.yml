# dsh-powerup bundle patch: inserts the Host row. The Client half is resolved
# from the same package through `dsh.client` in package.json; `name` must be
# byte-for-byte the package name because the client module graph locates the
# package by the Loader row name.
- insert:
    - id: dsh-powerup
      name: '@restregular/dsh-powerup'
